name: Buduj ZAPORA-AWF

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Pobierz pliki
        uses: actions/checkout@v4

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zainstaluj PyInstaller
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Zbuduj aplikacje
        run: >
          python -m PyInstaller --onedir --windowed --clean --noupx
          --name "ZAPORA-AWF"
          --icon ikona.ico
          --version-file wersja.txt
          --manifest manifest.xml
          --add-data "ikona.ico;."
          --add-data "logo.png;."
          --add-data "kiosk-tlo.jpg;."
          --add-data "kiosk-uklad.json;."
          --add-data "kiosk-korpus1.png;."
          --add-data "kiosk-korpus2.png;."
          --add-data "kiosk-korpus3.png;."
          --add-data "kiosk-korpus4.png;."
          --add-data "kiosk-plyta1.png;."
          --add-data "kiosk-plyta2.png;."
          --add-data "kiosk-plyta3.png;."
          --add-data "kiosk-plyta4.png;."
          zapora_awf.py

      - name: Zainstaluj Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Zbuduj instalator
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" instalator.iss
          dir *.exe

      - name: Wystaw instalator
        uses: actions/upload-artifact@v4
        with:
          name: INSTALATOR-ZAPORA-AWF
          path: ZAPORA-AWF-Instalator-*.exe

      - name: Wystaw wersje przenosna
        uses: actions/upload-artifact@v4
        with:
          name: PRZENOSNA-ZAPORA-AWF
          path: dist/ZAPORA-AWF/
